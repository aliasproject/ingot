version: "3.8"

services:
  # ------------------------------------------------------------
  # Dnsmasq (DNS Server)
  # ------------------------------------------------------------
  dns:
    container_name: devbox_dns
    image: ghcr.io/aliasproject/dnsmasq:latest
    restart: unless-stopped
    ports:
      - "5354:53/udp"
    networks:
      - internal
    # volumes:
    # - /etc/resolver:/config/resolver
    command:
      - "--address=/test/127.0.0.1"
      - "--server=1.1.1.1" # Forward to Cloudflare DNS
      - "--server=8.8.8.8" # Forward to Google DNS.
      - "--log-facility=-" # Logs

  # ------------------------------------------------------------
  # PHP
  # ------------------------------------------------------------
  php:
    container_name: devbox_php
    image: ghcr.io/aliasproject/php:8.0-fpm
    restart: unless-stopped
    volumes:
      - ${DEVBOX_PROJECT_ROOT:-./}:/home/alias
    networks:
      - internal

  # ------------------------------------------------------------
  # Nginx (Web Server)
  # ------------------------------------------------------------
  nginx:
    container_name: devbox_nginx
    image: ghcr.io/aliasproject/nginx:latest
    restart: unless-stopped
    volumes:
      - certs:/etc/nginx/ssl
      - vhosts:/etc/nginx/conf.d
      - ${DEVBOX_PROJECT_ROOT:-./}:/home/alias:ro
    ports:
      - 80:80
      - 443:443
    networks:
      - dev-network
      - internal
    depends_on:
      - dns
      - php

  # ------------------------------------------------------------
  # Watchman (Vhost Gen)
  # ------------------------------------------------------------
  watchman:
    container_name: devbox_watchman
    image: ghcr.io/aliasproject/watchman:latest
    restart: unless-stopped
    environment:
      - DOCKER_USER=mike
      - DOCKER_TOKEN=test
    volumes:
      - certs:/certs
      - vhosts:/vhosts
      - .:/public
      - ${DEVBOX_PROJECT_ROOT:-./}:/home/alias:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    depends_on:
      - nginx
    healthcheck:
      test: ash -c "[ -f /certs/AliasProjectCASelfSigned.pem ]"

  # ------------------------------------------------------------
  # MySQL (Database)
  # ------------------------------------------------------------
  mysql:
    container_name: devbox_mysql
    image: mysql:${MYSQL_SERVER:-8.0}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    ports:
      - 3306:3306
    networks:
      - dev-network
      - internal
    volumes:
      - mysql-${MYSQL_SERVER:-8.0}:/var/lib/mysql
    depends_on:
      - dns
      - php
      - nginx

  # ------------------------------------------------------------
  # Mailhog (Mail)
  # ------------------------------------------------------------
  mail:
    container_name: devbox_mail
    image: mailhog/mailhog:latest
    restart: on-failure
    ports:
      - 1025:1025
      - 8025:8025
    networks:
      - internal

volumes:
  # ------------------------------------------------------------
  # NGINX
  # ------------------------------------------------------------
  certs:
  vhosts:

  # ------------------------------------------------------------
  # MySQL
  # ------------------------------------------------------------
  mysql-8.0:
  mysql-5.7:

networks:
  internal:
    driver: bridge
  dev-network:
    driver: bridge
