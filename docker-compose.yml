version: "3.8"

services:
  # ------------------------------------------------------------
  # Dnsmasq (DNS Server)
  # ------------------------------------------------------------
  dns:
    image: ghcr.io/aliasproject/dnsmasq:latest
    restart: always
    ports:
      - "5354:53/udp"
    networks:
      - dev-network
    command:
      - "--address=/test/127.0.0.1"
      - "--server=1.1.1.1" # Forward to Cloudflare DNS
      - "--server=8.8.8.8" # Forward to Google DNS.
      - "--log-facility=-" # Logs
    
  # ------------------------------------------------------------
  # PHP
  # ------------------------------------------------------------
  php:
    image: ghcr.io/aliasproject/php:8.0-dev
    volumes:
      - .:/app
    networks:
      - dev-network
    depends_on:
      - dns
         
  # ------------------------------------------------------------
  # Nginx (Web Server)
  # ------------------------------------------------------------
  nginx:
    image: aliasproject/nginx
    volumes:
      - alias-certs:/etc/nginx/ssl
      - .:/app:ro
    ports:
      - 80:80
      - 443:443
    networks:
      - dev-network
    environment:
      - DOMAIN=win.test
    depends_on:
      - dns
      - php

  # ------------------------------------------------------------
  # MySQL (Database)
  # ------------------------------------------------------------
  mysql:
    image: mysql:${MYSQL_SERVER:-8.0}
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    ports:
      - 3306:3306
    networks:
      - dev-network
    volumes:
      - alias-mysql-${MYSQL_SERVER:-8.0}:/var/lib/mysql
    depends_on:
      - dns
      - php
      - nginx

  # ------------------------------------------------------------
  # Mailhog (Mail)
  # ------------------------------------------------------------
  mail:
    image: mailhog/mailhog:latest
    container_name: "mail"
    restart: on-failure
    ports:
      - 1025:1025
      - 8025:8025
    networks:
      - dev-network

volumes:
  # ------------------------------------------------------------
  # NGINX
  # ------------------------------------------------------------
  alias-certs:
    
  # ------------------------------------------------------------
  # MySQL
  # ------------------------------------------------------------
  alias-mysql-8.0:
    
networks:
  dev-network:
    driver: bridge
