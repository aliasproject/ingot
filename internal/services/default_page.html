    <head>
        <title>No project here</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            * {
                box-sizing: border-box;
                padding: 0;
                margin: 0;
            }

            body {
                font-family: sans-serif;
                font-size: 14px;
                -webkit-font-smoothing: antialiased;
                background: #fff;
                color: #666;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            body::after {
                content: "";
                position: fixed;
                inset: 0;
                z-index: -1;
                pointer-events: none;
                background: radial-gradient(
                    at top,
                    rgba(226, 232, 240, 0.5) 60%,
                    rgba(203, 213, 225, 0.5) 80%
                );
            }

            .shell {
                width: 100%;
                max-width: 600px;
                margin: 30px 10px;
                padding: 30px 20px 60px;
                text-align: center;
                background: linear-gradient(
                    0deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 1) 50%,
                    rgba(255, 255, 255, 0) 100%
                );
            }

            .alios-logo {
                display: block;
                width: 120px;
                margin: 0 auto 40px;
            }

            #alios-dark {
                display: none;
            }

            h1 {
                font-size: 20px;
                font-weight: 600;
                color: #000;
                margin-bottom: 12px;
            }

            p {
                line-height: 1.6;
                margin-bottom: 8px;
            }

            b,
            code {
                color: #000;
            }

            code {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 13px;
                background: rgba(15, 125, 195, 0.1);
                padding: 2px 6px;
                border-radius: 3px;
            }

            @media (prefers-color-scheme: dark) {
                body {
                    color: #999;
                }
                body::after {
                    background: radial-gradient(
                        at top,
                        rgba(0, 15, 30, 1) 40%,
                        rgba(0, 0, 0, 1) 80%
                    );
                }
                .shell {
                    background: linear-gradient(
                        0deg,
                        rgba(0, 0, 0, 0) 0%,
                        rgba(0, 0, 0, 0.15) 50%,
                        rgba(0, 0, 0, 0) 100%
                    );
                }
                #alios-dark {
                    display: block;
                }
                #alios-light {
                    display: none;
                }
                h1,
                b,
                code {
                    color: #fff;
                }
            }
        </style>
    </head>
